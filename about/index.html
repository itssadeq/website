<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Weight Test</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #0C0B0A;
    --fg: #E8E4DC;
    --muted: #6B665C;
    --accent: #2D8E6E;
    --accent-light: #3DB88E;
    --warm: #BA7517;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'EB Garamond', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 100%;
    max-width: 920px;
    aspect-ratio: 16 / 10;
    margin: 0 auto;
  }

  /* === FULCRUM === */
  .fulcrum {
    position: absolute;
    bottom: 14%;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-bottom: 26px solid var(--muted);
    opacity: 0.35;
  }

  /* === BEAM — RIGHT sinks, LEFT floats === */
  .beam {
    position: absolute;
    bottom: calc(14% + 26px);
    left: 50%;
    width: 76%;
    height: 2px;
    background: var(--muted);
    transform-origin: center center;
    opacity: 0.45;
    animation: beam-settle 2.2s ease-out forwards;
  }

  @keyframes beam-settle {
    0%   { transform: translateX(-50%) rotate(0deg); }
    40%  { transform: translateX(-50%) rotate(9deg); }
    70%  { transform: translateX(-50%) rotate(7deg); }
    100% { transform: translateX(-50%) rotate(8deg); }
  }

  /* === CHAINS === */
  .chain {
    position: absolute;
    width: 1px;
    background: repeating-linear-gradient(
      to bottom, var(--muted) 0px, var(--muted) 3px, transparent 3px, transparent 6px
    );
    opacity: 0.25;
  }

  .chain-left {
    left: 19.5%;
    bottom: calc(14% + 26px + 28px);
    height: 70px;
    animation: chain-grow 2.2s ease-out forwards;
  }
  @keyframes chain-grow { 0% { height: 40px; } 100% { height: 70px; } }

  .chain-right {
    right: 19.5%;
    bottom: calc(14% + 26px - 28px);
    height: 16px;
    animation: chain-shrink 2.2s ease-out forwards;
  }
  @keyframes chain-shrink { 0% { height: 40px; } 100% { height: 16px; } }

  /* === LEFT: HOLLOW CIRCLES — empty, floating === */
  .ego-side {
    position: absolute;
    left: 3%;
    top: 4%;
    width: 38%;
    height: 55%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float-drift 5s ease-in-out infinite;
  }

  @keyframes float-drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .ego-cluster {
    position: relative;
    width: 280px;
    height: 280px;
  }

  .hollow-circle {
    position: absolute;
    border-radius: 50%;
    border: 0.5px solid rgba(186, 117, 23, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: bubble-in 1.6s ease-out forwards;
  }

  @keyframes bubble-in {
    0% { opacity: 0; transform: scale(0.2); }
    60% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }

  .hollow-circle span {
    font-style: italic;
    color: var(--warm);
    letter-spacing: 0.06em;
  }

  .hc-1 {
    width: 180px; height: 180px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) !important;
    animation-delay: 0.2s;
  }
  .hc-1::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(186, 117, 23, 0.04), transparent 70%);
  }
  .hc-1 span { font-size: 24px; opacity: 0.2; }

  .hc-2 {
    width: 90px; height: 90px;
    top: 2%; right: 8%;
    animation-delay: 0.5s;
  }
  .hc-2 span { font-size: 10px; opacity: 0.15; }

  .hc-3 {
    width: 65px; height: 65px;
    bottom: 8%; left: 2%;
    animation-delay: 0.8s;
  }
  .hc-3 span { font-size: 9px; opacity: 0.14; }

  .hc-4 {
    width: 42px; height: 42px;
    top: 0%; left: 22%;
    animation-delay: 1s;
  }

  .hc-5 {
    width: 30px; height: 30px;
    bottom: 20%; right: 5%;
    animation-delay: 1.2s;
  }

  /* === RIGHT: FILLED CIRCLES — dense, grounded === */
  .data-side {
    position: absolute;
    right: 3%;
    bottom: 16%;
    width: 38%;
    height: 55%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .data-cluster {
    position: relative;
    width: 280px;
    height: 260px;
  }

  .filled-circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(45, 142, 110, 0.12);
    border: 0.5px solid rgba(61, 184, 142, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transform: translateY(12px);
  }

  .filled-circle span {
    font-family: 'DM Mono', monospace;
    font-weight: 400;
    color: var(--accent-light);
    letter-spacing: 0.03em;
    line-height: 1.35;
    padding: 15%;
  }

  @keyframes circle-land {
    0% { opacity: 0; transform: translateY(14px) scale(0.9); }
    65% { opacity: 1; transform: translateY(-2px) scale(1.02); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .fc-1 {
    width: 190px; height: 190px;
    top: 5%; left: 50%;
    transform: translateX(-50%);
    animation: circle-land 0.8s ease-out 1.1s forwards;
    background: rgba(45, 142, 110, 0.1);
    box-shadow: 0 0 40px rgba(45, 142, 110, 0.06);
  }
  .fc-1 span { font-size: 12.5px; }

  .fc-2 {
    width: 150px; height: 150px;
    bottom: 8%; left: 5%;
    animation: circle-land 0.8s ease-out 1.4s forwards;
    background: rgba(45, 142, 110, 0.09);
    box-shadow: 0 0 30px rgba(45, 142, 110, 0.05);
  }
  .fc-2 span { font-size: 11.5px; }

  .fc-3 {
    width: 130px; height: 130px;
    bottom: 2%; right: 8%;
    animation: circle-land 0.8s ease-out 1.7s forwards;
    background: rgba(45, 142, 110, 0.08);
    box-shadow: 0 0 25px rgba(45, 142, 110, 0.04);
  }
  .fc-3 span { font-size: 11px; }

  /* Subtle glow behind entire data cluster */
  .data-glow {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(45, 142, 110, 0.06), transparent 70%);
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: glow-in 1.5s ease-out 2.2s forwards;
  }
  @keyframes glow-in {
    to { opacity: 1; }
  }

  /* === BOTTOM LABELS === */
  .label {
    position: absolute;
    bottom: 3.5%;
    text-align: center;
    opacity: 0;
    animation: label-fade 0.8s ease-out 2.6s forwards;
  }
  @keyframes label-fade { to { opacity: 1; } }

  .label-left { left: 3%; width: 38%; }
  .label-right { right: 3%; width: 38%; }

  .label-text {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .label-left .label-text { color: rgba(186, 117, 23, 0.3); }
  .label-right .label-text { color: rgba(45, 142, 110, 0.5); }

  @media (prefers-reduced-motion: reduce) {
    .ego-side { animation: none; }
    .hollow-circle, .filled-circle, .data-glow, .label, .beam, .chain-left, .chain-right {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .hc-1 { transform: translate(-50%, -50%) !important; }
    .beam { transform: translateX(-50%) rotate(8deg) !important; }
  }
</style>
</head>
<body>

<div class="canvas">

  <div class="fulcrum"></div>
  <div class="beam"></div>
  <div class="chain-left"></div>
  <div class="chain-right"></div>

  <!-- LEFT: Hollow circles — empty, drifting -->
  <div class="ego-side">
    <div class="ego-cluster">
      <div class="hollow-circle hc-1"><span>ego</span></div>
      <div class="hollow-circle hc-2"><span>assumption</span></div>
      <div class="hollow-circle hc-3"><span>bias</span></div>
      <div class="hollow-circle hc-4"></div>
      <div class="hollow-circle hc-5"></div>
    </div>
  </div>

  <!-- RIGHT: Filled circles — dense, grounded, carrying real words -->
  <div class="data-side">
    <div class="data-glow"></div>
    <div class="data-cluster">
      <div class="filled-circle fc-1"><span>decisions grounded in data</span></div>
      <div class="filled-circle fc-2"><span>probabilistic thinking</span></div>
      <div class="filled-circle fc-3"><span>testable hypotheses</span></div>
    </div>
  </div>

  <!-- Labels -->
  <div class="label label-left">
    <span class="label-text">volume without substance</span>
  </div>
  <div class="label label-right">
    <span class="label-text">weight of evidence</span>
  </div>

</div>

</body>
</html>
