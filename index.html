<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadegh Mousavi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #060608;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: none;
    -webkit-font-smoothing: antialiased;
    transition: background 0.8s ease;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .content {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .name-row {
    position: absolute;
    top: calc(50% - 90px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: baseline;
    justify-content: center;
    white-space: nowrap;
    width: 100%;
  }

  .name {
    font-family: 'Cormorant', Georgia, serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 300;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: nameIn 2s ease-out 1.5s forwards;
    transition: color 0.7s ease;
    color: rgba(220, 216, 206, 0.55);
    position: relative;
  }

  body.flooded .name {
    color: rgba(10, 10, 12, 0.8);
  }

  /* Links — same baseline as name text */
  .link-left-wrap {
    position: fixed;
    top: calc(50% - 90px);
    right: calc(50% + clamp(160px, 18vw, 300px));
    height: clamp(2.2rem, 5vw, 3.8rem);
    display: flex;
    align-items: flex-end;
    padding-bottom: 0.35em;
  }

  .link-right-wrap {
    position: fixed;
    top: calc(50% - 90px);
    left: calc(50% + clamp(160px, 18vw, 300px));
    height: clamp(2.2rem, 5vw, 3.8rem);
    display: flex;
    align-items: flex-end;
    padding-bottom: 0.35em;
  }

  /* Hidden sentence */
  .hidden-sentence {
    position: absolute;
    top: calc(50% + 8px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant', Georgia, serif;
    font-size: clamp(0.85rem, 1.3vw, 1.05rem);
    font-weight: 400;
    font-style: italic;
    text-align: center;
    white-space: nowrap;
    line-height: 1.6;
    color: rgba(10, 10, 12, 0.6);
    transition: color 1s ease;
    max-width: 90vw;
  }

  body.flooded .hidden-sentence {
    color: rgba(10, 10, 12, 0.45);
  }

  /* Links — flanking the name */
  .link {
    text-decoration: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(10, 10, 12, 0);
    pointer-events: none;
    transition: transform 0.3s ease;
    cursor: none;
    overflow: hidden;
    white-space: nowrap;
  }

  /* After first reveal, links persist in dark mode */
  .link.persisted {
    pointer-events: auto;
    color: rgba(220, 216, 206, 0.2);
  }

  .link.persisted:hover {
    color: rgba(220, 216, 206, 0.6);
    transform: translateY(-2px);
  }

  /* During flood, links are dark on light */
  .link.materialized {
    pointer-events: auto;
    color: rgba(10, 10, 12, 0.3);
  }

  .link.materialized:hover {
    color: rgba(10, 10, 12, 0.75);
    transform: translateY(-2px);
  }

  .link-letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.25s ease, color 0.5s ease;
  }

  .link.materialized .link-letter,
  .link.persisted .link-letter {
    opacity: 1;
    transform: translateY(0);
  }

  /* Cursor */
  .cursor-dot {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(220, 216, 206, 0.3);
    pointer-events: none;
    z-index: 100;
    margin-left: -3px;
    margin-top: -3px;
    transition: background 0.5s, width 0.3s, height 0.3s, margin 0.3s;
  }

  body.flooded .cursor-dot {
    background: rgba(10, 10, 12, 0.25);
  }

  .cursor-dot.hovering {
    width: 28px;
    height: 28px;
    margin-left: -14px;
    margin-top: -14px;
    background: rgba(10, 10, 12, 0.04) !important;
    border: 1px solid rgba(10, 10, 12, 0.1);
  }

  @keyframes nameIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="content">
  <div class="name-row">
    <span class="name" id="name">Sadegh Mousavi</span>
  </div>

  <div class="link-left-wrap">
    <a href="/about/" class="link" id="linkLeft"></a>
  </div>
  <div class="link-right-wrap">
    <a href="/projects/" class="link" id="linkRight"></a>
  </div>

  <span class="hidden-sentence">You just did what I do for a living. Bringing light to rooms nobody else will enter.</span>
</div>

<div class="cursor-dot" id="cursor"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const cursorEl = document.getElementById('cursor');
const linkLeft = document.getElementById('linkLeft');
const linkRight = document.getElementById('linkRight');

// Wrap link text in letter spans for staggered reveal
function wrapLetters(el, text) {
  el.innerHTML = '';
  for (let i = 0; i < text.length; i++) {
    const span = document.createElement('span');
    span.className = 'link-letter';
    span.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    el.appendChild(span);
  }
}
wrapLetters(linkLeft, 'About Me');
wrapLetters(linkRight, 'Recent Projects');

let w, h, cx, cy;
let mouseX = -1000, mouseY = -1000;
let time = 0;
let proximity = 0;
let floodLevel = 0;
let isFlooded = false;
let linksRevealed = false; // once true, never goes back

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  cx = w / 2;
  cy = h / 2;
}
resize();
window.addEventListener('resize', resize);

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  cursorEl.style.left = mouseX + 'px';
  cursorEl.style.top = mouseY + 'px';
});

// Cursor hover on links
[linkLeft, linkRight].forEach(link => {
  link.addEventListener('mouseenter', () => cursorEl.classList.add('hovering'));
  link.addEventListener('mouseleave', () => cursorEl.classList.remove('hovering'));
});

// ─── Link materialization (one-time) ───
function materializeLinks() {
  if (linksRevealed) return;
  linksRevealed = true;

  [linkLeft, linkRight].forEach(link => {
    link.classList.add('materialized');
    const letters = link.querySelectorAll('.link-letter');
    letters.forEach((letter, i) => {
      letter.style.transitionDelay = (i * 45) + 'ms';
    });
  });
}

// Switch links to persisted mode (light text on dark bg)
function persistLinks() {
  [linkLeft, linkRight].forEach(link => {
    link.classList.remove('materialized');
    link.classList.add('persisted');
    // Clear stagger delays
    link.querySelectorAll('.link-letter').forEach(letter => {
      letter.style.transitionDelay = '0ms';
    });
  });
}

// Switch links back to materialized mode (dark text on light bg)
function floodLinks() {
  [linkLeft, linkRight].forEach(link => {
    link.classList.remove('persisted');
    link.classList.add('materialized');
  });
}

// ─── Main draw ───
function draw() {
  time += 0.008;
  ctx.clearRect(0, 0, w, h);

  // Proximity to center
  const dx = mouseX - cx;
  const dy = mouseY - cy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const maxDist = Math.sqrt(cx * cx + cy * cy);

  const targetProximity = Math.max(0, 1 - dist / (maxDist * 0.35));
  proximity += (targetProximity - proximity) * 0.04;

  // Flood — faster fill (0.05), slower drain (0.018)
  const targetFlood = proximity > 0.6 ? Math.pow((proximity - 0.6) / 0.4, 1.3) : 0;
  const floodSpeed = targetFlood > floodLevel ? 0.05 : 0.018;
  floodLevel += (targetFlood - floodLevel) * floodSpeed;

  // State transitions
  if (floodLevel > 0.5 && !isFlooded) {
    isFlooded = true;
    document.body.classList.add('flooded');
    document.body.style.background = '#f0ece4';
    if (!linksRevealed) {
      materializeLinks();
    } else {
      floodLinks();
    }
  } else if (floodLevel < 0.3 && isFlooded) {
    isFlooded = false;
    document.body.classList.remove('flooded');
    document.body.style.background = '#060608';
    if (linksRevealed) {
      persistLinks();
    }
  }

  // Pulse
  const basePulse = Math.sin(time * 1.2) * 0.3 + 0.7;
  const pulse = basePulse + proximity * Math.sin(time * 3) * 0.2;
  const np = Math.max(0, Math.min(1, pulse));

  // ─── Flood light ───
  if (floodLevel > 0.01) {
    const floodR = 40 + floodLevel * maxDist * 1.6;
    const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, floodR);
    fg.addColorStop(0, `rgba(240, 236, 228, ${floodLevel * 0.95})`);
    fg.addColorStop(0.55, `rgba(240, 236, 228, ${floodLevel * 0.75})`);
    fg.addColorStop(1, 'rgba(240, 236, 228, 0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, w, h);
  }

  // ─── Ambient glow ───
  if (floodLevel < 0.7) {
    const ambR = 80 + np * 50 + proximity * 120;
    const ag = ctx.createRadialGradient(cx, cy, 0, cx, cy, ambR);
    const ab = (1 - floodLevel) * 0.04;
    ag.addColorStop(0, `rgba(210, 206, 196, ${ab + np * 0.03 + proximity * 0.05})`);
    ag.addColorStop(0.5, `rgba(210, 206, 196, ${ab * 0.3 + proximity * 0.02})`);
    ag.addColorStop(1, 'rgba(210, 206, 196, 0)');
    ctx.beginPath();
    ctx.arc(cx, cy, ambR, 0, Math.PI * 2);
    ctx.fillStyle = ag;
    ctx.fill();
  }

  // ─── Core glow ───
  if (floodLevel < 0.85) {
    const fade = Math.max(0, 1 - floodLevel * 1.2);
    const coreR = 3 + np * 4 + proximity * 6;

    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 10);
    cg.addColorStop(0, `rgba(235, 232, 224, ${(0.6 + np * 0.3) * fade})`);
    cg.addColorStop(0.12, `rgba(220, 216, 206, ${(0.2 + np * 0.1) * fade})`);
    cg.addColorStop(0.5, `rgba(220, 216, 206, ${(0.02 + proximity * 0.04) * fade})`);
    cg.addColorStop(1, 'rgba(220, 216, 206, 0)');
    ctx.beginPath();
    ctx.arc(cx, cy, coreR * 10, 0, Math.PI * 2);
    ctx.fillStyle = cg;
    ctx.fill();

    // Bright center point
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(240, 238, 230, ${(0.7 + np * 0.3) * fade})`;
    ctx.fill();
  }

  // ─── Ripple rings ───
  if (proximity > 0.08 && floodLevel < 0.6) {
    const ringFade = (1 - floodLevel) * proximity;
    for (let r = 0; r < 3; r++) {
      const rt = (time * 0.7 + r * 2.1) % 6.28;
      const rr = 25 + rt * 35 * (1 + proximity);
      const ra = Math.max(0, (1 - rt / 6.28)) * ringFade * 0.07;

      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(220, 216, 206, ${ra})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
